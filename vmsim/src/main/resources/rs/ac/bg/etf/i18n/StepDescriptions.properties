INSTRUCTION_FETCHED=Fetched instruction: %s 0x%X (user %d).

TLB_LOOKUP_HIT=TLB lookup: hit (frame 0x%X).
TLB_LOOKUP_MISS=TLB lookup: miss.

PHYSICAL_ADDRESS_FROM_TLB=Formed physical address 0x%X from TLB entry (frame 0x%X).

TLB_INSERTED=Inserted new TLB entry.

TLB_EVICTED=Evicted TLB entry (frame 0x%X).
TLB_EVICTED_DIRTY=Evicted TLB entry (frame 0x%X), writing back dirty bit to page table.
TLB_REPLACED=Replaced existing TLB entry (frame 0x%X).
TLB_REPLACED_DIRTY=Wrote back dirty bit to page table (frame 0x%X).

TLB_DIRTY_BIT_UPDATED=Updated dirty bit in existing TLB entry.

MEMORY_READ=Read value 0x%X from physical address 0x%X.
MEMORY_WRITTEN=Wrote value 0x%X to physical address 0x%X.
MEMORY_EXECUTED=Executed instruction at physical address 0x%X.

PAGE_TABLE_ADDRESS_FORMED=Computed page table entry address: 0x%X (pointer 0x%X + offset 0x%X).
PHYSICAL_ADDRESS_FROM_PAGE_TABLE=Formed physical address 0x%X from page table (frame 0x%X).

PAGE_TABLE_LOOKUP_FAULT=Page table lookup: page %d not valid (page fault).
PAGE_TABLE_LOOKUP_HIT=Page table lookup: page %d -> frame 0x%X.
PAGE_TABLE_LOOKUP_HIT_DIRTY=Page table lookup: page %d -> frame 0x%X (dirty).

PAGE_FAULT_NO_FRAME=Page fault: page %d not valid, no free frames available.
PAGE_FAULT_LOADING=Page fault: page %d not valid, loading into free frame 0x%X.

FRAME_EVICTED=Evicted frame 0x%X (user %d, page %d).
FRAME_EVICTED_DIRTY=Evicted frame 0x%X (user %d, page %d), writing back to disk.

PAGE_LOADED_INTO_MEMORY=Loaded page %d from disk into frame 0x%X.
PAGE_STORED_TO_DISK=Wrote dirty page %d back to disk address 0x%X.

PAGE_TABLE_DIRTY_BIT_UPDATED=Set dirty bit for page %d in page table.
