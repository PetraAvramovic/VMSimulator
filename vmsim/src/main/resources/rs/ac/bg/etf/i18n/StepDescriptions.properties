# Step descriptions. Each message says where the values it uses came from -- which TLB entry, which
# page table entry, which part of the virtual address -- not just what happened.
#
# Arguments are positional, in the order the step supplies them (see the step's getStepDescription()).
# "Phrases" (TLB_ENTRY ... DIRTY_BIT_SOURCE_PAGE_TABLE) are not shown on their own: another message
# embeds one through a %s. "page N of user U" is a virtual page; "entry N of user U's page table" is that
# page's page table entry (its Index is the page number). A set-associative TLB's "TLB entry k (set s)" is
# way k of set s -- the "Entry k" table and "Set" column of the TLB tab.

INSTRUCTION_FETCHED=Fetched instruction: %s 0x%X (user %d).

# Phrases -- where an entry sits in the TLB, what a lookup searched, where a dirty bit was read.
# TLB_ENTRY: entry. TLB_ENTRY_IN_SET: entry (way), set. TLB_SEARCHED_SET: set.
TLB_ENTRY=TLB entry %d
TLB_ENTRY_IN_SET=TLB entry %d (set %d)
TLB_SEARCHED_ALL=all TLB entries
TLB_SEARCHED_SET=set %d
DIRTY_BIT_SOURCE_PAGE_TABLE=its page table entry

# TLB_LOOKUP_HIT: page, user, entry phrase, block.  TLB_LOOKUP_MISS: page, user, searched phrase.
TLB_LOOKUP_HIT=TLB lookup for page %d of user %d: hit in %s, block 0x%X.
TLB_LOOKUP_MISS=TLB lookup for page %d of user %d: miss (searched %s).

# physical address, block, entry phrase, word
PHYSICAL_ADDRESS_FROM_TLB=Formed physical address 0x%X: block 0x%X read from %s, word 0x%X taken from the virtual address.

# page, user, entry phrase, block
TLB_INSERTED=Inserted an entry for page %d of user %d into %s, copying block 0x%X from its page table entry.

# Evicted / replaced: entry phrase, block held, page and user it makes room for
#   (dirty variants: + page and user whose page table entry received the dirty bit).
TLB_EVICTED=Evicted %s, holding block 0x%X, to make room for page %d of user %d (victim chosen by the round-robin pointer).
TLB_EVICTED_DIRTY=Evicted %s, holding block 0x%X, to make room for page %d of user %d (victim chosen by the round-robin pointer); its dirty bit was written back to the page table entry of page %d of user %d.
TLB_REPLACED=Replaced %s, holding block 0x%X, to make room for page %d of user %d (the only entry it can occupy).
TLB_REPLACED_DIRTY=Replaced %s, holding block 0x%X, to make room for page %d of user %d (the only entry it can occupy); its dirty bit was written back to the page table entry of page %d of user %d.

# entry phrase, page, user
TLB_DIRTY_BIT_UPDATED=Set the dirty bit in %s.

MEMORY_READ=Read value 0x%X from physical address 0x%X.
MEMORY_WRITTEN=Wrote value 0x%X to physical address 0x%X.
MEMORY_EXECUTED=Executed instruction at physical address 0x%X.

# address, user, page table pointer, offset, page, words per entry
PAGE_TABLE_ADDRESS_FORMED=Computed page table entry address 0x%X: user %d's page table pointer 0x%X + offset 0x%X.

# physical address, block, page, user, word
PHYSICAL_ADDRESS_FROM_PAGE_TABLE=Formed physical address 0x%X: block 0x%X read from entry %d of user %d's page table, word 0x%X taken from the virtual address.

# fault: page, user.  hit: block, page, user.
PAGE_TABLE_LOOKUP_FAULT=Page table lookup: entry %d of user %d's page table is not valid (page fault).
PAGE_TABLE_LOOKUP_HIT=Page table lookup: block 0x%X read from entry %d of user %d's page table.
PAGE_TABLE_LOOKUP_HIT_DIRTY=Page table lookup: block 0x%X read from entry %d of user %d's page table (entry is dirty).

# The step before (the page table lookup) already said the page is not valid, so these only report the
# search for a frame: PAGE_FAULT_LOADING gets the free frame that was found, PAGE_FAULT_NO_FRAME nothing.
PAGE_FAULT_NO_FRAME=No free frame found, so a victim frame must be evicted.
PAGE_FAULT_LOADING=Free frame 0x%X found; the page will be loaded into it.

# frame, page it held, user, where its dirty bit was read (entry phrase or DIRTY_BIT_SOURCE_PAGE_TABLE)
FRAME_EVICTED=Evicted frame 0x%X, chosen by the replacement policy; it held page %d of user %d, clean according to %s.
FRAME_EVICTED_DIRTY=Evicted frame 0x%X, chosen by the replacement policy; it held page %d of user %d.

# loaded: page, user, disk block, frame.  stored: page, user, frame, disk block.
PAGE_LOADED_INTO_MEMORY=Loaded page %d of user %d from disk block 0x%X into frame 0x%X; its page table entry now maps to that frame.
PAGE_STORED_TO_DISK=Wrote dirty page %d of user %d from frame 0x%X back to disk block 0x%X.

# page, user
PAGE_TABLE_DIRTY_BIT_UPDATED=Set the dirty bit in entry %d of user %d's page table: the instruction writes to this page.
